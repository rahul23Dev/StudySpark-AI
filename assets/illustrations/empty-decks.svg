<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <!-- Empty decks: small books, an open folder and blank cards waiting to be organized. Transparent background. -->
  <ellipse cx="160" cy="206" rx="118" ry="10" fill="#152238" opacity="0.07"/>
  <!-- open folder (back) -->
  <path d="M150 96a8 8 0 0 1 8-8h30l10 10h60a8 8 0 0 1 8 8v92a8 8 0 0 1-8 8H158a8 8 0 0 1-8-8Z" fill="#18B6A4"/>
  <!-- blank cards standing in the folder -->
  <g transform="rotate(-6 214 120)">
    <rect x="172" y="76" width="78" height="56" rx="9" fill="#FFFFFF" stroke="#E7DCCB" stroke-width="2"/>
  </g>
  <g transform="rotate(5 220 128)">
    <rect x="182" y="86" width="78" height="56" rx="9" fill="#FFFFFF" stroke="#E7DCCB" stroke-width="2"/>
    <rect x="194" y="100" width="34" height="5" rx="2.5" fill="#D7F2EE"/>
  </g>
  <!-- folder front -->
  <path d="M146 130a8 8 0 0 1 8-8h108a8 8 0 0 1 8 8l-4 68a8 8 0 0 1-8 8H158a8 8 0 0 1-8-8Z" fill="#4FCDBE"/>
  <path d="M190 152h40" stroke="#FFF9F0" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <!-- book stack -->
  <rect x="42" y="172" width="118" height="28" rx="7" fill="#152238"/>
  <rect x="50" y="177" width="98" height="18" rx="4" fill="#FFF9F0"/>
  <path d="M54 183h90M54 190h90" stroke="#E7DCCB" stroke-width="2"/>
  <rect x="52" y="144" width="104" height="28" rx="7" fill="#FF8066"/>
  <rect x="58" y="149" width="90" height="18" rx="4" fill="#FFFFFF"/>
  <path d="M62 155h82M62 162h82" stroke="#FFE1D9" stroke-width="2"/>
  <rect x="128" y="144" width="8" height="28" fill="#FFB547"/>
  <!-- loose blank card on the floor -->
  <g transform="rotate(-14 92 120)">
    <rect x="58" y="98" width="70" height="46" rx="8" fill="#FFFFFF" stroke="#FFB59F" stroke-width="2.5"/>
  </g>
  <!-- sparkles -->
  <path d="M118 46q2.4 9.6 12 12q-9.6 2.4-12 12q-2.4-9.6-12-12q9.6-2.4 12-12Z" fill="#FFB547"/>
  <path d="M276 54q1.6 6.4 8 8q-6.4 1.6-8 8q-1.6-6.4-8-8q6.4-1.6 8-8Z" fill="#18B6A4"/>
  <path d="M48 78q1.2 4.8 6 6q-4.8 1.2-6 6q-1.2-4.8-6-6q4.8-1.2 6-6Z" fill="#FF8066"/>
</svg>
